[package]
name = "douyingo_desktop"
version = "2.0.2"
description = "DouyinGo React/Tauri desktop shell"
authors = ["DouyinGo Team"]
edition = "2021"

[lib]
name = "douyingo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
